<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>אישור מילים יומיות — KidsQuest</title>
  <style>
    :root {
      --bg: #121014;
      --card: #1c1917;
      --line: #3f322c;
      --text: #f5efe8;
      --muted: #b7a79a;
      --accent: #ff8a3d;
      --ok: #3dd68c;
      --no: #f07171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Heebo, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #1a1512;
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
    }
    header .row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      max-width: 980px;
      margin: 0 auto;
    }
    h1 { font-size: 20px; margin: 0; }
    .hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .count {
      background: #2a211c;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
    }
    button, .btn {
      border: 0;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }
    .primary { background: var(--accent); color: #1a0e08; }
    .ghost { background: #2a211c; color: var(--text); border: 1px solid var(--line); }
    .ok { background: #1b3a2c; color: var(--ok); border: 1px solid #2e6a4a; }
    main { max-width: 980px; margin: 0 auto; padding: 20px; }
    .add {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1.6fr auto;
      gap: 10px;
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 18px;
    }
    .add input, .word-input, .hint-input, .def-input {
      background: #0e0c0b;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 15px;
      width: 100%;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .card {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 10px;
      align-items: start;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 12px;
    }
    .card.on { border-color: var(--ok); background: #1b2420; }
    .card.off { border-color: #4a2a2a; opacity: 0.55; }
    .num { color: var(--accent); font-size: 12px; font-weight: 700; }
    .word-input { font-weight: 800; font-size: 18px; margin: 4px 0; }
    .def-input, .hint-input { font-size: 13px; min-height: 58px; resize: vertical; margin-top: 6px; }
    textarea.hint-input, textarea.def-input { display: block; }
    input[type="checkbox"] { width: 18px; height: 18px; margin-top: 8px; accent-color: var(--ok); }
    .picked {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      max-width: 980px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.5;
    }
    #copied { display: none; color: var(--ok); font-weight: 700; }
    @media (max-width: 700px) {
      .add { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <div>
        <h1>מילים יומיות — לאישור</h1>
        <p class="hint">סמני מה שנשאר. לכל מילה יש הגדרה מילונית ודוגמת שימוש. בטלי סימון כדי להסיר.</p>
      </div>
      <div class="actions">
        <span class="count">נשארות <span id="n">0</span> / <span id="total">0</span></span>
        <button class="ghost" id="all">סמן הכל</button>
        <button class="ghost" id="clear">נקה</button>
        <button class="ok" id="copyKeep">העתק מאושרות</button>
        <button class="ghost" id="copyDrop">העתק להסרה</button>
        <button class="primary" id="copyAll">העתק הודעה לסוכן</button>
        <span id="copied">הועתק</span>
      </div>
    </div>
    <p class="picked" id="picked"></p>
  </header>
  <main>
    <form class="add" id="addForm">
      <input id="newWord" placeholder="מילה" required />
      <input id="newDef" placeholder="הגדרה מילונית" required />
      <input id="newHint" placeholder="דוגמה לשימוש" required />
      <button class="primary" type="submit">הוסיפי</button>
    </form>
    <div class="grid" id="app"></div>
  </main>

      },
      {
            "id": "shayachut",
            "word": "שייכות",
            "definition": "הרגשה שאתה חלק מקבוצה ושמישהו רוצה אותך שם.",
            "hint": "שייכות במשפחה נראית כששואלים לדעתך בארוחה."
      },
      {
            "id": "zehut",
            "word": "זהות",
            "definition": "מי אתה ומה מייחד אותך — לא רק מה אחרים מצפים.",
            "hint": "זהות זה גם מה שאוהבים, לא רק איך שנראים."
      }
];

    const KEEP_KEY = "kidsquest-daily-words-keep-v3";
    const EDIT_KEY = "kidsquest-daily-words-edits-v2";
    const EXTRA_KEY = "kidsquest-daily-words-extra-v2";

    const extras = JSON.parse(localStorage.getItem(EXTRA_KEY) || "[]");
    const edits = JSON.parse(localStorage.getItem(EDIT_KEY) || "{}");
    const savedKeep = localStorage.getItem(KEEP_KEY);
    const words = () => [...BUILTIN, ...extras];
    const selected = new Set(
      savedKeep ? JSON.parse(savedKeep) : words().map((w) => w.id)
    );

    function entry(w) {
      const e = edits[w.id] || {};
      return {
        id: w.id,
        word: (e.word || w.word).trim() || w.word,
        definition: (e.definition || w.definition || "").trim() || w.definition || "",
        hint: (e.hint || w.hint).trim() || w.hint,
      };
    }

    function keepList() {
      return words().filter((w) => selected.has(w.id)).map(entry);
    }
    function dropList() {
      return words().filter((w) => !selected.has(w.id)).map(entry);
    }

    function persist() {
      localStorage.setItem(KEEP_KEY, JSON.stringify([...selected]));
      localStorage.setItem(EDIT_KEY, JSON.stringify(edits));
      localStorage.setItem(EXTRA_KEY, JSON.stringify(extras));
    }

    function flashCopied() {
      const el = document.getElementById("copied");
      el.style.display = "inline";
      setTimeout(() => (el.style.display = "none"), 1500);
    }

    async function copyText(text) {
      await navigator.clipboard.writeText(text);
      flashCopied();
    }

    function agentMessage() {
      const keep = keepList();
      const drop = dropList();
      const lines = ["עדכון מילים יומיות:"];
      lines.push("");
      lines.push("להשאיר (" + keep.length + "):");
      keep.forEach((w, i) => {
        lines.push((i + 1) + ". " + w.word);
        lines.push("   הגדרה: " + w.definition);
        lines.push("   דוגמה: " + w.hint);
      });
      lines.push("");
      lines.push("להסיר (" + drop.length + "):");
      if (!drop.length) lines.push("(אין)");
      drop.forEach((w) => lines.push("- " + w.word));
      return lines.join("\n");
    }

    function save() {
      persist();
      const keep = keepList();
      document.getElementById("n").textContent = keep.length;
      document.getElementById("total").textContent = words().length;
      document.getElementById("picked").textContent = keep.length
        ? "נשארות: " + keep.map((w) => w.word).join(" · ")
        : "לא נשארה אף מילה";
      document.querySelectorAll("div.card").forEach((el) => {
        const on = selected.has(el.dataset.id);
        el.classList.toggle("on", on);
        el.classList.toggle("off", !on);
        const cb = el.querySelector("input[type=checkbox]");
        if (cb) cb.checked = on;
      });
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
    }

    function render() {
      const app = document.getElementById("app");
      app.innerHTML = "";
      words().forEach((raw, i) => {
        const w = entry(raw);
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.id = raw.id;
        const on = selected.has(raw.id);
        card.innerHTML =
          '<input type="checkbox" ' + (on ? "checked" : "") + " />" +
          "<div>" +
          '<div class="num">#' + (i + 1) + "</div>" +
          '<input class="word-input" type="text" value="' + esc(w.word) + '" />' +
          '<textarea class="def-input" rows="2" placeholder="הגדרה">' + esc(w.definition) + "</textarea>" +
          '<textarea class="hint-input" rows="2" placeholder="דוגמה">' + esc(w.hint) + "</textarea>" +
          "</div>";
        card.querySelector("input[type=checkbox]").addEventListener("change", (e) => {
          if (e.target.checked) selected.add(raw.id);
          else selected.delete(raw.id);
          save();
        });
        card.querySelector(".word-input").addEventListener("input", (e) => {
          edits[raw.id] = { ...(edits[raw.id] || {}), word: e.target.value };
          persist();
        });
        card.querySelector(".def-input").addEventListener("input", (e) => {
          edits[raw.id] = { ...(edits[raw.id] || {}), definition: e.target.value };
          persist();
        });
        card.querySelector(".hint-input").addEventListener("input", (e) => {
          edits[raw.id] = { ...(edits[raw.id] || {}), hint: e.target.value };
          persist();
        });
        app.appendChild(card);
      });
      save();
    }

    document.getElementById("all").onclick = () => {
      words().forEach((w) => selected.add(w.id));
      render();
    };
    document.getElementById("clear").onclick = () => {
      selected.clear();
      save();
    };
    document.getElementById("copyKeep").onclick = () => {
      const keep = keepList();
      copyText(keep.length ? keep.map((w, i) => (i + 1) + ". " + w.word).join("\n") : "אין מאושרות");
    };
    document.getElementById("copyDrop").onclick = () => {
      const drop = dropList();
      copyText(drop.length ? drop.map((w) => w.word).join("\n") : "אין להסרה");
    };
    document.getElementById("copyAll").onclick = () => copyText(agentMessage());
    document.getElementById("addForm").onsubmit = (e) => {
      e.preventDefault();
      const word = document.getElementById("newWord").value.trim();
      const definition = document.getElementById("newDef").value.trim();
      const hint = document.getElementById("newHint").value.trim();
      if (!word || !definition || !hint) return;
      const id = "custom-" + Date.now();
      extras.push({ id, word, definition, hint });
      selected.add(id);
      document.getElementById("newWord").value = "";
      document.getElementById("newDef").value = "";
      document.getElementById("newHint").value = "";
      persist();
      render();
    };

    render();
  </script>
</body>
</html>
