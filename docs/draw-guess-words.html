<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>מילים לצייר ונחש</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c1020;
      --card: #151b30;
      --line: #2c3658;
      --text: #f4f7ff;
      --muted: #9aa6c8;
      --yes: #3dd68c;
      --yes-bg: #143028;
      --no: #f07171;
      --no-bg: #2a1820;
      --accent: #5ce1ff;
      --phrase: #ffd27a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Heebo, "Segoe UI", Arial, sans-serif;
      background: radial-gradient(1200px 500px at 100% -10%, #1a2748 0%, var(--bg) 55%);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(12, 16, 32, 0.94);
      border-bottom: 1px solid var(--line);
      padding: 14px 20px 10px;
      backdrop-filter: blur(8px);
    }
    .row, nav, .filters { max-width: 1100px; margin: 0 auto; }
    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    h1 { font-size: 22px; margin: 0; }
    .hint { color: var(--muted); font-size: 14px; margin: 4px 0 0; max-width: 640px; }
    .actions, .filters, nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    nav { margin-top: 10px; }
    nav a {
      color: var(--accent);
      text-decoration: none;
      background: #1c243c;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .count {
      background: #1c243c;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
    }
    .count b.yes { color: var(--yes); }
    .count b.no { color: var(--no); }
    .count b.phrase { color: var(--phrase); }
    button, select, input[type="search"], input[type="text"] {
      border: 0;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 700;
      font-family: inherit;
      font-size: 14px;
    }
    button { cursor: pointer; }
    .primary { background: var(--accent); color: #062028; }
    .ghost { background: #1c243c; color: var(--text); border: 1px solid var(--line); }
    .ghost.on { border-color: var(--accent); color: var(--accent); }
    #copied { display: none; color: var(--yes); font-weight: 800; }
    main { max-width: 1100px; margin: 0 auto; padding: 18px 20px 48px; }
    .add {
      display: grid;
      grid-template-columns: 1.2fr 1fr auto;
      gap: 10px;
      background: var(--card);
      border: 1px dashed #3d4d78;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 8px;
    }
    .add input, .add select, .filters input {
      background: #0c1020;
      border: 1px solid var(--line);
      color: var(--text);
      width: 100%;
    }
    .filters { margin: 0 0 16px; }
    .filters input { max-width: 220px; font-weight: 400; }
    .err { color: var(--no); min-height: 1.2em; margin: 0 0 14px; font-size: 14px; }
    section { margin-bottom: 22px; scroll-margin-top: 150px; }
    .section-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    h2 { font-size: 16px; margin: 0; color: var(--accent); }
    .mini { padding: 4px 8px; font-size: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--yes-bg);
      border: 2px solid var(--yes);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 8px 6px 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      font-size: 15px;
    }
    .chip.no { background: var(--no-bg); border-color: #6a3038; color: #c9b0b4; }
    .chip.phrase { box-shadow: inset 0 0 0 1px var(--phrase); }
    .chip .tag {
      font-size: 12px;
      border-radius: 999px;
      padding: 2px 8px;
      background: #123226;
      color: var(--yes);
    }
    .chip.no .tag { background: #3a1c22; color: var(--no); }
    .chip .space { font-size: 11px; font-weight: 700; color: var(--phrase); }
    .chip.new::before { content: "חדשה"; font-size: 11px; font-weight: 700; color: var(--accent); }
    .empty { color: var(--muted); font-size: 14px; }
    @media (max-width: 700px) { .add { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <div>
        <h1>מילים לצייר ונחש</h1>
        <p class="hint">לחצי על מילה כדי להחליף בין כן ללא. תג «רווח» אומר שיש יותר ממילה אחת, ובמקלדת של המשחק עדיין אין מקש רווח. יהלום נמצא בטבע. הבחירה נשמרת בדפדפן.</p>
      </div>
      <div class="actions">
        <span class="count">כן <b class="yes" id="yesCount">0</b> · לא <b class="no" id="noCount">0</b> · רווח <b class="phrase" id="phraseCount">0</b></span>
        <button class="ghost" id="allYes" type="button">הכל כן</button>
        <button class="ghost" id="allNo" type="button">הכל לא</button>
        <button class="ghost" id="phrasesNo" type="button">רווחים → לא</button>
        <button class="primary" id="copy" type="button">העתק לסוכן</button>
        <span id="copied">הועתק</span>
      </div>
    </div>
    <nav id="nav"></nav>
  </header>
  <main>
    <form class="add" id="addForm">
      <input id="newWord" type="text" placeholder="מילה חדשה" autocomplete="off" />
      <select id="newCat"></select>
      <button class="primary" type="submit">הוסיפי</button>
    </form>
    <p class="err" id="err"></p>
    <div class="filters">
      <button class="ghost on" type="button" data-filter="all">הכל</button>
      <button class="ghost" type="button" data-filter="yes">רק כן</button>
      <button class="ghost" type="button" data-filter="no">רק לא</button>
      <button class="ghost" type="button" data-filter="phrase">עם רווח</button>
      <input id="search" type="search" placeholder="חיפוש" />
    </div>
    <div id="app"></div>
  </main>

{"category":"דמויות","word":"אינדיאני"},{"category":"דמויות","word":"נינג'ה"},{"category":"דמויות","word":"סמוראי"},{"category":"דמויות","word":"סוכן חשאי"},{"category":"דמויות","word":"בלרינה"},{"category":"דמויות","word":"גיבור על"},{"category":"דמויות","word":"נבל על"},{"category":"דמויות","word":"מכשפה"},{"category":"דמויות","word":"פיה"},{"category":"דמויות","word":"גמד"},{"category":"דמויות","word":"ענק"},{"category":"דמויות","word":"גובלין"},{"category":"דמויות","word":"שדון"},{"category":"דמויות","word":"טרול"},{"category":"דמויות","word":"ערפד"},{"category":"דמויות","word":"זומבי"},{"category":"דמויות","word":"רוח רפאים"},{"category":"דמויות","word":"מומיה"},{"category":"דמויות","word":"איש זאב"},{"category":"דמויות","word":"חייזר"},{"category":"דמויות","word":"איש רובוט"},{"category":"דמויות","word":"בובת שלג"},{"category":"ספורט","word":"כדורגל"},{"category":"ספורט","word":"כדורסל"},{"category":"ספורט","word":"משקולות"},{"category":"ספורט","word":"מתח"},{"category":"ספורט","word":"טרמפולינה"},{"category":"ספורט","word":"חבל קפיצה"},{"category":"ספורט","word":"חישוק הולה הופ"},{"category":"ספורט","word":"קסדת אופניים"},{"category":"ספורט","word":"כדורעף"},{"category":"ספורט","word":"כדור בסיס"},{"category":"ספורט","word":"כדור טניס"},{"category":"ספורט","word":"מחבט טניס"},{"category":"ספורט","word":"כדור פינג פונג"},{"category":"ספורט","word":"מחבט פינג פונג"},{"category":"ספורט","word":"שולחן פינג פונג"},{"category":"ספורט","word":"כדור באולינג"},{"category":"ספורט","word":"פין באולינג"},{"category":"ספורט","word":"שער כדורגל"},{"category":"ספורט","word":"סל כדורסל"},{"category":"ספורט","word":"רשת טניס"},{"category":"ספורט","word":"שק אגרוף"},{"category":"ספורט","word":"כפפת בייסבול"},{"category":"ספורט","word":"אלת בייסבול"},{"category":"ספורט","word":"מגלשי סקי"},{"category":"ספורט","word":"מקלות סקי"},{"category":"ספורט","word":"סנובורד"},{"category":"ספורט","word":"גלשן גלים"},{"category":"ספורט","word":"סנפירי צלילה"},{"category":"ספורט","word":"שנורקל"},{"category":"ספורט","word":"מסיכת צלילה"},{"category":"ספורט","word":"חכה"},{"category":"ספורט","word":"פיתיון"},{"category":"ספורט","word":"רשת דיג"},{"category":"ספורט","word":"חץ וקשת"},{"category":"ספורט","word":"לוח מטרה"},{"category":"ספורט","word":"גביע"},{"category":"ספורט","word":"מדליה"},{"category":"ספורט","word":"פודיום"},{"category":"ספורט","word":"משרוקית"},{"category":"ספורט","word":"סטופר"},{"category":"ספורט","word":"כרטיס אדום"},{"category":"ספורט","word":"כרטיס צהוב"},{"category":"ספורט","word":"לפיד"},{"category":"ספורט","word":"מדורת שבט"},{"category":"ספורט","word":"גיטרת רוק"},{"category":"ספורט","word":"תופי ג'אז"},{"category":"ספורט","word":"מיקרופון במה"},{"category":"ספורט","word":"מסכת תיאטרון"},{"category":"ספורט","word":"לוח צבעים"},{"category":"ספורט","word":"כן ציור"},{"category":"ספורט","word":"בלון הליום"},{"category":"ספורט","word":"מסיבת יום הולדת"},{"category":"ספורט","word":"כובע מסיבה"},{"category":"ספורט","word":"משרוקית יום הולדת"},{"category":"ספורט","word":"זיקוקים"},{"category":"ספורט","word":"קונפטי"},{"category":"ספורט","word":"עוגת חתונה"},{"category":"ספורט","word":"זר פרחים"},{"category":"ספורט","word":"טבעת יהלום"},{"category":"ספורט","word":"תיבת אוצר"},{"category":"ספורט","word":"מפת אוצר"},{"category":"ספורט","word":"מטבע זהב"},{"category":"ספורט","word":"שק מטבעות"},{"category":"ספורט","word":"מטיל זהב"}]};
    const STORAGE_KEY = "draw-guess-words-v2";
    const state = load();
    let filter = "all";
    let query = "";

    function load() {
      const base = { choices: {}, custom: [] };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return base;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return base;
        base.choices = parsed.choices && typeof parsed.choices === "object" ? parsed.choices : {};
        base.custom = Array.isArray(parsed.custom) ? parsed.custom.filter((item) => item && item.word && item.category) : [];
      } catch (err) {
        return base;
      }
      return base;
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function keyOf(item) {
      return item.category + "\n" + item.word;
    }

    function choiceOf(item) {
      return state.choices[keyOf(item)] === "no" ? "no" : "yes";
    }

    function allItems() {
      return DATA.words.concat(state.custom);
    }

    function categories() {
      const names = DATA.order.slice();
      for (const item of state.custom) {
        if (!names.includes(item.category)) names.push(item.category);
      }
      return names;
    }

    function titleOf(category) {
      return DATA.titles[category] || category;
    }

    function isPhrase(word) {
      return /\s/.test(word);
    }

    function visible(item) {
      const choice = choiceOf(item);
      if (filter === "phrase" && !isPhrase(item.word)) return false;
      if ((filter === "yes" || filter === "no") && choice !== filter) return false;
      if (query && !item.word.includes(query) && !titleOf(item.category).includes(query)) return false;
      return true;
    }

    function renderNav() {
      const nav = document.getElementById("nav");
      nav.innerHTML = "";
      for (const category of categories()) {
        const link = document.createElement("a");
        link.href = "#cat-" + category;
        link.textContent = category;
        nav.appendChild(link);
      }
    }

    function renderCats() {
      const select = document.getElementById("newCat");
      const current = select.value;
      select.innerHTML = "";
      for (const name of categories()) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = titleOf(name);
        select.appendChild(option);
      }
      const extra = document.createElement("option");
      extra.value = "__new__";
      extra.textContent = "קטגוריה חדשה…";
      select.appendChild(extra);
      if ([...select.options].some((option) => option.value === current)) select.value = current;
    }

    function setChoice(item, choice) {
      state.choices[keyOf(item)] = choice;
    }

    function render() {
      const app = document.getElementById("app");
      app.innerHTML = "";
      let yes = 0;
      let no = 0;
      let phrase = 0;
      for (const item of allItems()) {
        if (choiceOf(item) === "no") no += 1;
        else yes += 1;
        if (isPhrase(item.word)) phrase += 1;
      }
      document.getElementById("yesCount").textContent = String(yes);
      document.getElementById("noCount").textContent = String(no);
      document.getElementById("phraseCount").textContent = String(phrase);

      const customKeys = new Set(state.custom.map(keyOf));
      for (const category of categories()) {
        const items = allItems().filter((item) => item.category === category && visible(item));
        if (items.length === 0) continue;
        const section = document.createElement("section");
        section.id = "cat-" + category;
        const head = document.createElement("div");
        head.className = "section-head";
        const title = document.createElement("h2");
        const total = allItems().filter((item) => item.category === category).length;
        title.textContent = titleOf(category) + " (" + total + ")";
        head.appendChild(title);
        const yesBtn = document.createElement("button");
        yesBtn.type = "button";
        yesBtn.className = "ghost mini";
        yesBtn.textContent = "כן לקטגוריה";
        yesBtn.addEventListener("click", () => {
          for (const item of allItems()) if (item.category === category) setChoice(item, "yes");
          save();
          render();
        });
        const noBtn = document.createElement("button");
        noBtn.type = "button";
        noBtn.className = "ghost mini";
        noBtn.textContent = "לא לקטגוריה";
        noBtn.addEventListener("click", () => {
          for (const item of allItems()) if (item.category === category) setChoice(item, "no");
          save();
          render();
        });
        head.append(yesBtn, noBtn);
        section.appendChild(head);
        const chips = document.createElement("div");
        chips.className = "chips";
        for (const item of items) {
          const choice = choiceOf(item);
          const button = document.createElement("button");
          button.type = "button";
          button.className = "chip" + (choice === "no" ? " no" : "") + (isPhrase(item.word) ? " phrase" : "") + (customKeys.has(keyOf(item)) ? " new" : "");
          button.append(document.createTextNode(item.word));
          if (isPhrase(item.word)) {
            const space = document.createElement("span");
            space.className = "space";
            space.textContent = "רווח";
            button.appendChild(space);
          }
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = choice === "no" ? "לא" : "כן";
          button.appendChild(tag);
          button.addEventListener("click", () => {
            setChoice(item, choice === "no" ? "yes" : "no");
            save();
            render();
          });
          chips.appendChild(button);
        }
        section.appendChild(chips);
        app.appendChild(section);
      }
      if (!app.children.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "אין מילים בתצוגה הזו.";
        app.appendChild(empty);
      }
    }

    function messageForAgent() {
      const groups = new Map();
      const droppedWords = [];
      const added = [];
      const builtinKeys = new Set(DATA.words.map(keyOf));
      for (const item of allItems()) {
        const choice = choiceOf(item);
        const custom = !builtinKeys.has(keyOf(item));
        if (choice === "yes") {
          if (!groups.has(item.category)) groups.set(item.category, []);
          groups.get(item.category).push(item.word);
          if (custom) added.push(titleOf(item.category) + ": " + item.word);
        } else if (!custom) {
          droppedWords.push(item.word);
        }
      }
      const lines = ["עדכני את רשימת המילים בצייר ונחש לפי הבחירה הזו.", "", "נשארות:"];
      for (const [category, list] of groups) {
        lines.push(titleOf(category) + ": " + list.join(", "));
      }
      lines.push("", "יוצאות: " + (droppedWords.length ? droppedWords.join(", ") : "אין"));
      lines.push("", "הוספתי: " + (added.length ? added.join(" | ") : "אין"));
      return lines.join("\n");
    }

    document.getElementById("addForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const err = document.getElementById("err");
      const word = document.getElementById("newWord").value.trim().replace(/\s+/g, " ");
      let category = document.getElementById("newCat").value;
      if (category === "__new__") {
        category = (window.prompt("שם הקטגוריה", "") || "").trim();
      }
      if (!word) {
        err.textContent = "חסרה מילה.";
        return;
      }
      if (!category) {
        err.textContent = "חסרה קטגוריה.";
        return;
      }
      if (allItems().some((item) => item.word === word)) {
        err.textContent = "המילה כבר ברשימה.";
        return;
      }
      state.custom.push({ category, word });
      setChoice({ category, word }, "yes");
      save();
      document.getElementById("newWord").value = "";
      err.textContent = "";
      renderNav();
      renderCats();
      render();
    });

    document.getElementById("allYes").addEventListener("click", () => {
      for (const item of allItems()) setChoice(item, "yes");
      save();
      render();
    });
    document.getElementById("allNo").addEventListener("click", () => {
      for (const item of allItems()) setChoice(item, "no");
      save();
      render();
    });
    document.getElementById("phrasesNo").addEventListener("click", () => {
      for (const item of allItems()) if (isPhrase(item.word)) setChoice(item, "no");
      save();
      render();
    });
    document.getElementById("copy").addEventListener("click", async () => {
      await navigator.clipboard.writeText(messageForAgent());
      const copied = document.getElementById("copied");
      copied.style.display = "inline";
      setTimeout(() => { copied.style.display = "none"; }, 1600);
    });
    document.querySelectorAll("[data-filter]").forEach((button) => {
      button.addEventListener("click", () => {
        filter = button.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach((other) => other.classList.toggle("on", other === button));
        render();
      });
    });
    document.getElementById("search").addEventListener("input", (event) => {
      query = event.target.value.trim();
      render();
    });

    renderNav();
    renderCats();
    render();
  </script>
