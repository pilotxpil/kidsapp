# KidsQuest — web UI (static) + API (Node on :3001)
# DNS: kids.synaboard.com → VM IP
# Web files: /home/pilotxpil/kidsapp/web

server {
    server_name kids.synaboard.com;

    root /home/pilotxpil/kidsapp/web;
    index index.html;

    # API routes (mobile + web fetch) — must match server/src/index.ts mounts
    location ~ ^/(auth|tasks|rewards|kids|family|health)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Expo static export (SPA)
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/kids.synaboard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kids.synaboard.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = kids.synaboard.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name kids.synaboard.com;
    return 404;
}
